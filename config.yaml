project:
  name: "cv-image-retrieval"
  seed: 42

dataset:
  provider: "kagglehub"
  handle: "skylord/oxbuildings"

retrieval:
  top_k: 5

features:

  sift:
    enabled: true
    nfeatures: 0

  hog:
    enabled: true
    orientations: 9
    pixels_per_cell: [8, 8]
    cells_per_block: [2, 2]

  bovw:
    enabled: true
    vocabulary_size: 256

similarity:
  metric: "cosine"

paths:
  outputs: "outputs"
  descriptors: "outputs/descriptors"
  vocabularies: "outputs/vocabularies"
  representations: "outputs/representations"
  rankings: "outputs/rankings"
  metrics: "outputs/metrics"
  figures: "outputs/figures"
